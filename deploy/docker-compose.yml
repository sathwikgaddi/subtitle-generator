services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subtitles}
      POSTGRES_USER: ${POSTGRES_USER:-subtitles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subtitles} -d ${POSTGRES_DB:-subtitles}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
